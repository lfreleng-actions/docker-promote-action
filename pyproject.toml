[project]
name = "docker-promote-action"
version = "0.0.0"
description = "Promote staged container images to a release registry by digest"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Standard library only: the composite action runs on the Python its
# setup-python step provides, with no package install.
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[tool.basedpyright]
# Standard mode keeps error-level type checking without the strict-only
# warnings that fire throughout on parsed JSON, whose shape is dynamic.
typeCheckingMode = "standard"
# The basedpyright pre-commit mirror bundles its own runtime and cannot
# carry project dependencies; mypy performs the import-aware checking.
reportMissingImports = false
reportMissingModuleSource = false
